name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    name: Control plane (Go)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: launchpad
          POSTGRES_PASSWORD: launchpad
          POSTGRES_DB: launchpad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U launchpad -d launchpad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: control-plane

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Runs the real migrations against the service container, so a broken
      # schema fails CI rather than the next deploy.
      - name: Test
        env:
          LAUNCHPAD_TEST_DATABASE_URL: postgres://launchpad:launchpad@localhost:5432/launchpad?sslmode=disable
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  dashboard:
    name: Dashboard (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci

      # `npm run build` runs tsc first, so a type error fails here rather than
      # reaching a browser as a runtime crash.
      - name: Type-check and build
        run: npm run build

      - name: Test
        run: npm test
